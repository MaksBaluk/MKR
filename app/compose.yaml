name: competencematch
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 4s
      timeout: 3s
      retries: 25

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://cm_app:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV}
      DEMO_MODE: ${DEMO_MODE}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_QUESTION_GENERATION: ${LLM_QUESTION_GENERATION}
      LLM_QUESTION_STRATEGY: ${LLM_QUESTION_STRATEGY}
      LLM_QUESTION_REPHRASING: ${LLM_QUESTION_REPHRASING}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "backend.seed"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *app_environment
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pg_data:
