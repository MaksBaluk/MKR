[project]
name = "competencematch"
version = "1.0.0"
description = "Candidate-centric adaptive interview and explainable job matching MVP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
